<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            width: 400px;
            max-width: 100%;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }
        
        .logo span {
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        
        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        
        .alert-info {
            background-color: #e6f3ff;
            color: #0066cc;
            border: 1px solid #b8daff;
        }
        
        .links {
            text-align: center;
            margin-top: 25px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .separator {
            margin: 0 10px;
            color: #ddd;
        }
        
        .cadastro-card {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed #eee;
            text-align: center;
        }
        
        .cadastro-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .btn-cadastro {
            display: inline-block;
            padding: 10px 25px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-cadastro:hover {
            background: #667eea;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><span>Sistema</span> de Login</h1>
            <p style="color: #777; margin-top: 10px;">Acesse sua conta ou cadastre-se</p>
        </div>
        
        <!-- Mensagens de Alerta -->
        <div th:if="${param.error}" class="alert alert-error">
            <strong>❌ Erro!</strong> Usuário ou senha inválidos.
        </div>
        
        <div th:if="${param.success}" class="alert alert-success">
            <strong>✅ Sucesso!</strong> Cadastro realizado! Faça seu login.
        </div>
        
        <div th:if="${param.logout}" class="alert alert-info">
            <strong>👋 Até logo!</strong> Você saiu do sistema.
        </div>
        
        <!-- Formulário de Login -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>👤 Login</label>
                <input type="text" name="username" placeholder="Digite seu login" required autofocus>
            </div>
            
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" name="password" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn">ENTRAR NO SISTEMA</button>
        </form>
        
        <!-- Área de Cadastro - Opção para novos usuários -->
        <div class="cadastro-card">
            <p>Não tem uma conta?</p>
            <a href="/cadastro" class="btn-cadastro">
                CRIAR NOVA CONTA
            </a>
            <p style="margin-top: 15px; font-size: 12px; color: #999;">
                É rápido e gratuito!
            </p>
        </div>
        
        <!-- Links adicionais -->
        <div class="links">
            <a href="/sobre">Sobre</a>
            <span class="separator">|</span>
            <a href="/ajuda">Ajuda</a>
            <span class="separator">|</span>
            <a href="/termos">Termos</a>
        </div>
    </div>
</body>
</html>
