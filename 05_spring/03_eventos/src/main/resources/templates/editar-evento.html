<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Editar Evento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2b1055, #6a0572);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      color: #ff4ecd;
      text-shadow: 0 0 10px rgba(255, 78, 205, 0.8);
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #ff4ecd;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 78, 205, 0.5);
    }

    label {
      color: #ff9de2;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #ff4ecd;
      color: #fff;
    }

    .form-control:focus {
      background: rgba(0, 0, 0, 0.5);
      border-color: #ff4ecd;
      box-shadow: 0 0 10px rgba(255, 78, 205, 0.7);
      color: #fff;
    }

    .btn-neon {
      background: transparent;
      border: 2px solid #ff4ecd;
      color: #ff4ecd;
      font-weight: bold;
      padding: 10px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-neon:hover {
      background: #ff4ecd;
      color: #2b1055;
      box-shadow: 0 0 20px rgba(255, 78, 205, 1);
    }

    /* ===== IMAGENS ===== */
    .img-option {
      height: 230px;
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="radio"] {
      display: none;
    }

    input[type="radio"]:checked + img {
      border: 3px solid #ff4ecd;
      box-shadow: 0 0 25px rgba(255, 78, 205, 1);
      transform: scale(1.02);
    }
  </style>
</head>

<body>

<header th:replace="~{navbar :: navbar}"></header>

<main class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card p-4">
        <h1 class="text-center mb-4">Editar Evento</h1>

        <form th:action="@{/editarEvento/{idEvento}(idEvento=${evento.idEvento})}" method="post">

          <!-- ===== CAROUSEL IMAGENS ===== -->
          <div class="mb-4">
            <label class="form-label mb-3">Escolha a imagem do evento</label>

            <div id="imgCarousel" class="carousel slide" data-bs-ride="false">
              <div class="carousel-inner text-center">

                <div class="carousel-item"
                     th:classappend="${evento.imagem == 'evento1.jpg'} ? ' active'">
                  <label>
                    <input type="radio" name="imagem" value="evento1.jpg"
                           th:checked="${evento.imagem == 'evento1.jpg'}">
                    <img src="/img/evento1.jpg" class="d-block w-100 img-option">
                  </label>
                </div>

                <div class="carousel-item"
                     th:classappend="${evento.imagem == 'evento2.jpg'} ? ' active'">
                  <label>
                    <input type="radio" name="imagem" value="evento2.jpg"
                           th:checked="${evento.imagem == 'evento2.jpg'}">
                    <img src="/img/evento2.jpg" class="d-block w-100 img-option">
                  </label>
                </div>

                <div class="carousel-item"
                     th:classappend="${evento.imagem == 'evento3.jpg'} ? ' active'">
                  <label>
                    <input type="radio" name="imagem" value="evento3.jpg"
                           th:checked="${evento.imagem == 'evento3.jpg'}">
                    <img src="/img/evento3.jpg" class="d-block w-100 img-option">
                  </label>
                </div>

                <div class="carousel-item"
                     th:classappend="${evento.imagem == 'evento4.jpg'} ? ' active'">
                  <label>
                    <input type="radio" name="imagem" value="evento4.jpg"
                           th:checked="${evento.imagem == 'evento4.jpg'}">
                    <img src="/img/evento4.jpg" class="d-block w-100 img-option">
                  </label>
                </div>

              </div>

              <button class="carousel-control-prev" type="button"
                      data-bs-target="#imgCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
              </button>

              <button class="carousel-control-next" type="button"
                      data-bs-target="#imgCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
              </button>
            </div>
          </div>

          <!-- NOME -->
          <div class="mb-3">
            <label>Nome do evento</label>
            <input type="text" class="form-control" name="nome"
                   th:value="${evento.nome}" required>
          </div>

          <!-- LOCAL -->
          <div class="mb-3">
            <label>Local</label>
            <input type="text" class="form-control" name="local"
                   th:value="${evento.local}" required>
          </div>

          <!-- DATA -->
          <div class="mb-3">
            <label>Data</label>
            <input type="date" class="form-control" name="data"
                   th:value="${evento.data}" required>
          </div>

          <!-- HORA -->
          <div class="mb-4">
            <label>Hora</label>
            <input type="time" class="form-control" name="hora"
                   th:value="${evento.hora}" required>
          </div>

          <button class="btn btn-neon w-100">Salvar Alterações</button>

        </form>
      </div>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
