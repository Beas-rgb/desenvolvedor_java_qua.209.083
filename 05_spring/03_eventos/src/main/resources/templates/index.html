<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Eventos Spring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #14002b, #2b1055);
      color: #fff;
    }

    h1 {
      color: #ff4ecd;
      text-shadow: 0 0 15px #ff4ecd;
    }

    /* ===== CAROUSEL NEON ===== */
    .carousel-neon {
      position: relative;
      border-radius: 25px;
      overflow: hidden;
      padding: 4px;
      margin-bottom: 60px;
    }

    .carousel-neon::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        45deg,
        red, orange, yellow, lime, cyan, blue, magenta, red
      );
      background-size: 400%;
      animation: rgb 6s linear infinite;
      filter: blur(12px);
      z-index: -1;
    }

    @keyframes rgb {
      0% { background-position: 0% }
      100% { background-position: 400% }
    }

    .carousel-inner img {
      height: 420px;
      object-fit: cover;
      border-radius: 20px;
    }

    /* ===== CARD EVENTO ===== */
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border: 1px solid #ff4ecd;
      box-shadow: 0 0 15px rgba(255, 78, 205, 0.4);
      transition: 0.4s;
      overflow: hidden;
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 0 35px rgba(255, 78, 205, 0.9);
    }

    .card-img-top {
      height: 180px;
      object-fit: cover;
    }

    .card-title {
      color: #ff9de2;
      text-shadow: 0 0 8px #ff4ecd;
    }

    .btn-neon {
      border: 1px solid #ff4ecd;
      color: #ff4ecd;
      background: transparent;
      transition: 0.3s;
    }

    .btn-neon:hover {
      background: #ff4ecd;
      color: #2b1055;
      box-shadow: 0 0 15px #ff4ecd;
    }
  </style>
</head>

<body>

<header th:replace="~{navbar :: navbar}"></header>

<main class="container mt-4">

  <!-- ===== CAROUSEL ===== -->
  <div class="carousel-neon">
    <div id="carouselEventos" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">

        <div class="carousel-item active">
          <img src="/img/evento1.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
          <img src="/img/evento2.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
          <img src="/img/evento3.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
          <img src="/img/evento4.jpg" class="d-block w-100">
        </div>

      </div>

      <button class="carousel-control-prev" type="button"
        data-bs-target="#carouselEventos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button"
        data-bs-target="#carouselEventos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  <!-- ===== TÍTULO ===== -->
  <h1 class="mb-4 text-center">✨ Próximos Eventos ✨</h1>

  <!-- ===== CARDS ===== -->
  <div class="row row-cols-1 row-cols-md-3 g-4">

    <div class="col" th:each="evento : ${eventos}">
      <div class="card h-100">

        <!-- IMAGEM DO EVENTO -->
        <img
          th:src="@{/img/{img}(img=${evento.imagem})}"
          class="card-img-top"
          alt="Imagem do evento">

        <div class="card-body">
          <h5 class="card-title" th:text="${evento.nome}"></h5>

          <p><strong>📍 Local:</strong>
            <span th:text="${evento.local}"></span>
          </p>

          <p><strong>📅 Data:</strong>
            <span th:text="${#temporals.format(evento.data,'dd/MM/yyyy')}"></span>
          </p>

          <p><strong>⏰ Hora:</strong>
            <span th:text="${evento.hora}"></span>
          </p>
        </div>

        <!-- BOTÕES -->
        <div class="card-footer d-flex justify-content-between">
          <a
            th:href="@{/editarEvento/{id}(id=${evento.idEvento})}"
            class="btn btn-sm btn-neon">
            Editar
          </a>

          <a
            th:href="@{/excluirEvento/{id}(id=${evento.idEvento})}"
            class="btn btn-sm btn-neon"
            onclick="return confirm('Deseja excluir este evento?')">
            Excluir
          </a>
        </div>

      </div>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
