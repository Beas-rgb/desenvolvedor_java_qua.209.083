<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos Spring</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2b1055, #6a0572);
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, .08);
      border: 1px solid #ff4ecd;
      border-radius: 18px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(255, 78, 205, 0.8);
    }

    .card-img-top {
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
    }

    .card-img-top:hover {
      transform: scale(1.05);
      border: 2px solid #ff4ecd;
      box-shadow: 0 0 20px rgba(255, 78, 205, 0.8);
    }
  </style>
</head>

<body>

  <header th:replace="~{navbar :: navbar}"></header>

  <main class="container mt-4">

    <h1 class="mb-4">Próximos Eventos</h1>
    <hr>

    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col" th:each="evento : ${eventos}">
        <div class="card h-100">

          <!-- Imagem corrigida -->
          <img th:src="${evento.imagem != null ? '/img/' + evento.imagem : '/img/evento-default.jpg'}"
               class="card-img-top">

          <div class="card-body">
            <h5 th:text="${evento.nome}"></h5>
            <p><strong>Local:</strong> <span th:text="${evento.local}"></span></p>
            <p><strong>Data:</strong> <span th:text="${#temporals.format(evento.data,'dd/MM/yyyy')}"></span></p>
            <p><strong>Hora:</strong> <span th:text="${evento.hora}"></span></p>
          </div>

          <div class="card-footer d-flex justify-content-between">
            <a th:href="@{/editarEvento/{idEvento}(idEvento=${evento.idEvento})}" 
               class="btn btn-sm btn-outline-info">Editar</a>

            <a th:href="@{/excluirEvento/{idEvento}(idEvento=${evento.idEvento})}" 
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Tem certeza que deseja excluir este evento?')">Excluir</a>
          </div>

        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
