<nav class="navbar navbar-expand-lg bg-dark mb-5"
     data-bs-theme="dark"
     th:fragment="navbar"
     xmlns:th="http://www.thymeleaf.org">

  <style>
    .logo-gif {
      height: 45px;
      border-radius: 12px;
      padding: 4px;
      border: 2px solid #00ffe1;
      box-shadow:
        0 0 10px rgba(0, 255, 225, 0.8),
        0 0 20px rgba(0, 255, 225, 0.6);
      transition: 0.3s ease-in-out;
    }

    .logo-gif:hover {
      transform: scale(1.1);
      box-shadow:
        0 0 15px rgba(0, 255, 225, 1),
        0 0 30px rgba(0, 255, 225, 0.9);
    }

    .nav-link {
      color: #fff !important;
      position: relative;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background: #00ffe1;
      box-shadow: 0 0 8px #00ffe1;
      transition: width 0.3s;
    }

    .nav-link:hover::after {
      width: 100%;
    }
  </style>

  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
      <img th:src="@{/img/logo-neon.gif}"
           alt="Logo Eventos"
           class="logo-gif">
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:class="${activePage == 'home' ? 'nav-link active' : 'nav-link'}" th:href="@{/}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link"  th:class="${activePage == 'cadastrarEvento' ? 'nav-link active' : 'nav-link'}" th:href="@{/cadastrarEvento}">
            Cadastrar Evento
          </a>
        </li>
      </ul>

      <form class="d-flex">
        <input class="form-control me-2 bg-dark text-light border-info"
               type="search"
               placeholder="Buscar evento">
        <button class="btn btn-outline-info" type="submit">
          Buscar
        </button>
      </form>

    </div>
  </div>
</nav>
