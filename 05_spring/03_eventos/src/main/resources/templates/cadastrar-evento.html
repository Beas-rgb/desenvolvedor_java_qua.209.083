<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Evento</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2b1055, #6a0572);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      color: #ff4ecd;
      text-shadow: 0 0 10px rgba(255, 78, 205, 0.8);
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #ff4ecd;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 78, 205, 0.5);
    }

    label {
      color: #ff9de2;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #ff4ecd;
      color: #fff;
    }

    .form-control:focus {
      background: rgba(0, 0, 0, 0.5);
      border-color: #ff4ecd;
      box-shadow: 0 0 10px rgba(255, 78, 205, 0.7);
      color: #fff;
    }

    .btn-neon {
      background: transparent;
      border: 2px solid #ff4ecd;
      color: #ff4ecd;
      font-weight: bold;
      padding: 10px;
      border-radius: 30px;
      transition: all 0.3s;
    }

    .btn-neon:hover {
      background: #ff4ecd;
      color: #2b1055;
      box-shadow: 0 0 20px rgba(255, 78, 205, 1);
    }

    /* IMAGEM PREVIEW */
    .img-preview {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      border: 2px dashed #ff4ecd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-preview span {
      color: #ff9de2;
    }
  </style>
</head>

<body>

  <!-- header -->
  <header th:replace="~{navbar :: navbar}"></header>

  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card p-4">
          <h1 class="text-center mb-4">Cadastrar Evento</h1>

          <!-- FORM -->
          <form method="POST"
                action="/cadastrarEvento"
                enctype="multipart/form-data">

            <!-- IMAGEM -->
            <div class="mb-3">
              <label class="form-label">Imagem do evento</label>

              <div class="img-preview" id="preview">
                <span>Pré-visualização da imagem</span>
              </div>

              <input type="file"
                     class="form-control"
                     name="imagem"
                     accept="image/*"
                     onchange="previewImagem(event)">
            </div>

            <!-- NOME -->
            <div class="mb-3">
              <label for="nome" class="form-label">Nome do evento</label>
              <input type="text" class="form-control" name="nome" id="nome" required>
            </div>

            <!-- LOCAL -->
            <div class="mb-3">
              <label for="local" class="form-label">Local</label>
              <input type="text" class="form-control" name="local" id="local" required>
            </div>

            <!-- DATA -->
            <div class="mb-3">
              <label for="data" class="form-label">Data</label>
              <input type="date" class="form-control" name="data" id="data" required>
            </div>

            <!-- HORA -->
            <div class="mb-4">
              <label for="hora" class="form-label">Hora</label>
              <input type="time" class="form-control" name="hora" id="hora" required>
            </div>

          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function previewImagem(event) {
      const preview = document.getElementById("preview");
      preview.innerHTML = "";

      const img = document.createElement("img");
      img.src = URL.createObjectURL(event.target.files[0]);

      preview.appendChild(img);
    }
  </script>

</body>
</html>
